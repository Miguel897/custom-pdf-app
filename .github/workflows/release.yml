# Push a tag like v1.0.0 to build, test and publish PdfDesk.exe as a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test PdfDesk.slnx -c Release

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/PdfDesk.App -c Release -r win-x64 -o publish -p:Version=$version

      # Third-party action with write access: pinned to a commit (v2.6.2); Dependabot updates it.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: publish/PdfDesk.exe
          generate_release_notes: true
