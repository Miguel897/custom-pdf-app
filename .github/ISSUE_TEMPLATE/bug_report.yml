name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems: please use the private reporting described in
        [SECURITY.md](https://github.com/Miguel897/pdfdesk/blob/main/SECURITY.md) instead.
        Do not attach PDFs with personal data.
  - type: input
    id: version
    attributes:
      label: PdfDesk version
      description: ⋯ › About PdfDesk
      placeholder: 0.2.0 (44aca3c)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, 125 % display scaling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PDF with form fields
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from today's log (⋯ › Open log folder). Check them for private file names first.
      render: text
